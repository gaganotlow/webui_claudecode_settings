<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Settings</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex; }

  /* Sidebar */
  .sidebar { width: 280px; background: #161616; border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; flex-shrink: 0; min-height: 100vh; }
  .sidebar-header { padding: 20px; border-bottom: 1px solid #2a2a2a; }
  .sidebar-header h2 { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .home-path { margin-bottom: 12px; padding: 8px; border: 1px solid #2a2a2a; border-radius: 6px; background: #111; }
  .home-path label { display: block; margin-bottom: 5px; font-size: 11px; color: #777; font-family: monospace; }
  .home-path input { width: 100%; padding: 7px 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 5px; color: #ccc; font-size: 12px; font-family: monospace; outline: none; }
  .home-path input:focus { border-color: #2563eb; }
  .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .btn-primary { background: #2563eb; color: white; width: 100%; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-ghost { background: transparent; color: #888; border: 1px solid #333; }
  .btn-ghost:hover { border-color: #555; color: #ccc; }
  .btn-danger { background: transparent; color: #ef4444; border: 1px solid #7f1d1d; }
  .btn-danger:hover { background: #7f1d1d; }
  .btn-apply { background: #059669; color: white; }
  .btn-apply:hover { background: #047857; }
  .btn-save { background: #8b5cf6; color: white; }
  .btn-save:hover { background: #7c3aed; }
  .sidebar-import { width: 100%; margin-top: 8px; }

  .profile-list { flex: 1; overflow-y: auto; padding: 8px; }
  .group-title { padding: 14px 12px 6px; font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: .8px; }
  .profile-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.15s; position: relative; }
  .profile-item:hover { background: #1e1e1e; }
  .profile-item.active { background: #1a1a2e; border: 1px solid #2563eb33; }
  .profile-item .name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .profile-item .meta { font-size: 11px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 72px; }
  .profile-item .hint { margin-top: 8px; font-size: 12px; color: #999; }
  .profile-item .actions { position: absolute; right: 12px; top: 12px; display: none; gap: 4px; }
  .profile-item:hover .actions { display: flex; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; min-width: 0; }
  .main-header { padding: 20px 32px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
  .main-header h1 { font-size: 20px; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .badge-active { background: #05966933; color: #34d399; }
  .badge-editing { background: #8b5cf633; color: #a78bfa; }

  .content { padding: 32px; max-width: 1100px; width: 100%; }
  .section { margin-bottom: 32px; }
  .section-title { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; font-family: monospace; }
  .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; color: #e0e0e0; font-size: 13px; font-family: monospace; outline: none; transition: border-color 0.15s; }
  .form-group textarea { min-height: 170px; resize: vertical; line-height: 1.5; }
  .form-group input:focus, .form-group textarea:focus { border-color: #2563eb; }
  .form-group input::placeholder, .form-group textarea::placeholder { color: #444; }

  .current-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; padding: 20px; }
  .current-card .row { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 1.4fr); gap: 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid #1e1e1e; }
  .current-card .row:last-child { border-bottom: none; }
  .current-card .key { font-family: monospace; font-size: 12px; color: #888; }
  .current-card .val { font-family: monospace; font-size: 13px; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }

  .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .profile-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; }
  .profile-card.active { border-color: #059669; background: #102018; }
  .profile-card-header { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .profile-card-title { min-width: 0; }
  .profile-card-title h3 { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile-card-title p { margin-top: 4px; font-size: 12px; color: #777; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .kv-list { display: grid; gap: 6px; }
  .kv-row { display: grid; grid-template-columns: 105px minmax(0, 1fr); gap: 8px; font-size: 12px; }
  .kv-key { color: #777; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv-val { color: #ccc; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .form-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; min-height: auto; border-right: none; border-bottom: 1px solid #2a2a2a; }
    .profile-list { max-height: 220px; }
    .main-header { padding: 16px 20px; }
    .content { padding: 20px; }
    .current-card .row { grid-template-columns: 1fr; gap: 4px; }
    .current-card .val { text-align: left; }
  }

  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast-success { background: #059669; color: white; }
  .toast-error { background: #ef4444; color: white; }

  .empty-state { text-align: center; padding: 40px; color: #555; }
  .empty-state p { margin-top: 8px; font-size: 13px; }

  .divider { height: 1px; background: #2a2a2a; margin: 24px 0; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>Config Home</h2>
    <div class="home-path">
      <label>HOME_DIR</label>
      <input type="text" id="homeDir" placeholder="~/.claude">
    </div>
    <button class="btn btn-ghost sidebar-import" onclick="saveHomeDir()">切换主目录</button>
    <div class="divider"></div>
    <h2>Profiles</h2>
    <button class="btn btn-primary" onclick="newProfile()">+ 新建配置</button>
    <button class="btn btn-ghost sidebar-import" onclick="showImportView()">粘贴导入</button>
  </div>
  <div class="profile-list" id="profileList"></div>
</div>

<div class="main">
  <div class="main-header">
    <h1 id="pageTitle">当前配置</h1>
    <span id="pageBadge" class="badge badge-active">当前生效</span>
  </div>
  <div class="content">
    <!-- Current Config View -->
    <div id="currentView">
      <div class="section">
        <div class="section-title">全部配置</div>
        <div class="profile-grid" id="allProfiles"></div>
      </div>
      <div class="section">
        <div class="section-title">当前 settings.json 生效值</div>
        <div class="current-card" id="currentCard"></div>
      </div>
    </div>

    <div id="importView" style="display:none">
      <div class="section">
        <div class="section-title">粘贴 settings env 片段</div>
        <div class="form-group">
          <label>ALIAS</label>
          <input type="text" id="importName" placeholder="例如: UoCode / 备用中转">
        </div>
        <div class="form-group">
          <label>GROUP</label>
          <input type="text" id="importGroup" placeholder="例如: 国内中转 / 官方 / 备用">
        </div>
        <div class="form-group">
          <label>CONFIG_TEXT</label>
          <textarea id="importText" placeholder='"ANTHROPIC_AUTH_TOKEN": "sk-...",&#10;"ANTHROPIC_BASE_URL": "https://...",&#10;"ANTHROPIC_MODEL": "gpt-5.5"'></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-save" onclick="importProfile(false)">导入为配置</button>
          <button class="btn btn-apply" onclick="importProfile(true)">导入并应用</button>
          <button class="btn btn-ghost" onclick="cancelEdit()">取消</button>
        </div>
      </div>
    </div>

    <div id="editView" style="display:none">
      <div class="section">
        <div class="section-title" id="editTitle">编辑配置</div>
        <div class="form-group">
          <label>ALIAS</label>
          <input type="text" id="profileName" placeholder="例如: UoCode / 官方API / 备用节点">
        </div>
        <div class="form-group">
          <label>GROUP</label>
          <input type="text" id="profileGroup" placeholder="例如: 国内中转 / 官方 / 备用">
        </div>
        <div class="divider"></div>
        <div class="form-group">
          <label>ANTHROPIC_AUTH_TOKEN</label>
          <input type="text" id="f_ANTHROPIC_AUTH_TOKEN" placeholder="API Key">
        </div>
        <div class="form-group">
          <label>ANTHROPIC_BASE_URL</label>
          <input type="text" id="f_ANTHROPIC_BASE_URL" placeholder="https://api.anthropic.com">
        </div>
        <div class="form-group">
          <label>ANTHROPIC_MODEL</label>
          <input type="text" id="f_ANTHROPIC_MODEL" placeholder="claude-sonnet-4-20250514">
        </div>
        <div class="form-group">
          <label>ANTHROPIC_DEFAULT_HAIKU_MODEL</label>
          <input type="text" id="f_ANTHROPIC_DEFAULT_HAIKU_MODEL" placeholder="claude-haiku-4-5-20251001">
        </div>
        <div class="form-group">
          <label>ANTHROPIC_DEFAULT_OPUS_MODEL</label>
          <input type="text" id="f_ANTHROPIC_DEFAULT_OPUS_MODEL" placeholder="claude-opus-4-7">
        </div>
        <div class="form-group">
          <label>ANTHROPIC_DEFAULT_SONNET_MODEL</label>
          <input type="text" id="f_ANTHROPIC_DEFAULT_SONNET_MODEL" placeholder="claude-sonnet-4-6">
        </div>
        <div class="form-group">
          <label>ANTHROPIC_REASONING_MODEL</label>
          <input type="text" id="f_ANTHROPIC_REASONING_MODEL" placeholder="claude-sonnet-4-6">
        </div>
        <div class="form-actions">
          <button class="btn btn-save" onclick="saveProfile()">保存配置</button>
          <button class="btn btn-apply" onclick="applyEditing()">保存并应用</button>
          <button class="btn btn-ghost" onclick="cancelEdit()">取消</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ENV_KEYS = {{ env_keys | tojson }};
let profiles = [];
let currentEnv = {};
let appConfig = {};
let editingId = null;

async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  return res.json();
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast toast-${type} show`;
  setTimeout(() => el.className = 'toast', 2500);
}

function getFormEnv() {
  const env = {};
  ENV_KEYS.forEach(k => {
    env[k] = document.getElementById('f_' + k).value.trim();
  });
  return env;
}

function setFormEnv(env) {
  ENV_KEYS.forEach(k => {
    document.getElementById('f_' + k).value = env[k] || '';
  });
}

function isActiveProfile(profile) {
  return ENV_KEYS.every(k => (profile.env[k] || '') === (currentEnv[k] || ''));
}

function groupProfiles() {
  return profiles.reduce((groups, profile) => {
    const group = profile.group || '默认';
    if (!groups[group]) groups[group] = [];
    groups[group].push(profile);
    return groups;
  }, {});
}

function renderProfiles() {
  const list = document.getElementById('profileList');
  if (profiles.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>暂无保存的配置</p></div>';
    return;
  }
  const groups = groupProfiles();
  list.innerHTML = Object.entries(groups).map(([group, items]) => `
    <div class="group-title">${esc(group)}</div>
    ${items.map(p => {
      const isActive = isActiveProfile(p);
      return `
        <div class="profile-item ${editingId === p.id ? 'active' : ''}" onclick="editProfile('${p.id}')">
          <div class="name">${esc(p.name)} ${isActive ? '<span style="color:#34d399;font-size:11px">&#9679; 生效中</span>' : ''}</div>
          <div class="meta">${esc(p.env.ANTHROPIC_BASE_URL || '未设置URL')}</div>
          ${isActive ? '<div class="hint">当前 settings.json 正在使用这组配置</div>' : ''}
          <div class="actions">
            <button class="btn btn-sm btn-apply" onclick="event.stopPropagation();applyProfile('${p.id}')">应用</button>
            <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteProfile('${p.id}')">删除</button>
          </div>
        </div>`;
    }).join('')}
  `).join('');
}

function renderAllProfiles() {
  const grid = document.getElementById('allProfiles');
  if (profiles.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>暂无保存的配置，先新建或粘贴导入。</p></div>';
    return;
  }
  grid.innerHTML = profiles.map(p => {
    const isActive = isActiveProfile(p);
    return `
      <div class="profile-card ${isActive ? 'active' : ''}">
        <div class="profile-card-header">
          <div class="profile-card-title">
            <h3>${esc(p.name)}</h3>
            <p>${esc(p.group || '默认')} · ${esc(p.env.ANTHROPIC_BASE_URL || '未设置URL')}</p>
          </div>
          <div class="profile-card-actions">
            <button class="btn btn-sm btn-apply" onclick="applyProfile('${p.id}')">应用</button>
            <button class="btn btn-sm btn-ghost" onclick="editProfile('${p.id}')">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteProfile('${p.id}')">删除</button>
          </div>
        </div>
        <div class="kv-list">
          <div class="kv-row"><span class="kv-key">MODEL</span><span class="kv-val" title="${esc(p.env.ANTHROPIC_MODEL || '')}">${esc(p.env.ANTHROPIC_MODEL || '<未设置>')}</span></div>
          <div class="kv-row"><span class="kv-key">OPUS</span><span class="kv-val" title="${esc(p.env.ANTHROPIC_DEFAULT_OPUS_MODEL || '')}">${esc(p.env.ANTHROPIC_DEFAULT_OPUS_MODEL || '<未设置>')}</span></div>
          <div class="kv-row"><span class="kv-key">SONNET</span><span class="kv-val" title="${esc(p.env.ANTHROPIC_DEFAULT_SONNET_MODEL || '')}">${esc(p.env.ANTHROPIC_DEFAULT_SONNET_MODEL || '<未设置>')}</span></div>
          <div class="kv-row"><span class="kv-key">HAIKU</span><span class="kv-val" title="${esc(p.env.ANTHROPIC_DEFAULT_HAIKU_MODEL || '')}">${esc(p.env.ANTHROPIC_DEFAULT_HAIKU_MODEL || '<未设置>')}</span></div>
        </div>
      </div>`;
  }).join('');
}

function renderCurrent() {
  const card = document.getElementById('currentCard');
  card.innerHTML = `
    <div class="row">
      <span class="key">HOME_DIR</span>
      <span class="val" title="${esc(appConfig.home_dir || '')}">${esc(appConfig.home_dir || '<未设置>')}</span>
    </div>
    <div class="row">
      <span class="key">SETTINGS_PATH</span>
      <span class="val" title="${esc(appConfig.settings_path || '')}">${esc(appConfig.settings_path || '<未设置>')}</span>
    </div>
    ${ENV_KEYS.map(k => `
      <div class="row">
        <span class="key">${k}</span>
        <span class="val" title="${esc(currentEnv[k] || '')}">${esc(currentEnv[k] || '<未设置>')}</span>
      </div>`).join('')}`;
}

async function reloadData() {
  [appConfig, currentEnv, profiles] = await Promise.all([
    api('/api/config'),
    api('/api/current'),
    api('/api/profiles'),
  ]);
  document.getElementById('homeDir').value = appConfig.home_dir || '';
  renderCurrent();
  renderProfiles();
  renderAllProfiles();
}

async function saveHomeDir() {
  const homeDir = document.getElementById('homeDir').value.trim();
  const res = await api('/api/config', { method: 'POST', body: { home_dir: homeDir } });
  if (res.error) {
    toast(res.error, 'error');
    return;
  }
  await reloadData();
  showCurrent();
  toast('已切换主目录');
}

function showCurrent() {
  editingId = null;
  document.getElementById('currentView').style.display = '';
  document.getElementById('importView').style.display = 'none';
  document.getElementById('editView').style.display = 'none';
  document.getElementById('pageTitle').textContent = '全部配置';
  document.getElementById('pageBadge').className = 'badge badge-active';
  document.getElementById('pageBadge').textContent = '管理与切换';
  renderProfiles();
  renderAllProfiles();
}

function showEditForm(profile) {
  document.getElementById('currentView').style.display = 'none';
  document.getElementById('importView').style.display = 'none';
  document.getElementById('editView').style.display = '';
  if (profile) {
    editingId = profile.id;
    document.getElementById('pageTitle').textContent = '编辑配置';
    document.getElementById('pageBadge').className = 'badge badge-editing';
    document.getElementById('pageBadge').textContent = '编辑中';
    document.getElementById('editTitle').textContent = '编辑: ' + profile.name;
    document.getElementById('profileName').value = profile.name;
    document.getElementById('profileGroup').value = profile.group || '默认';
    setFormEnv(profile.env);
  } else {
    editingId = null;
    document.getElementById('pageTitle').textContent = '新建配置';
    document.getElementById('pageBadge').className = 'badge badge-editing';
    document.getElementById('pageBadge').textContent = '新建';
    document.getElementById('editTitle').textContent = '新建配置';
    document.getElementById('profileName').value = '';
    document.getElementById('profileGroup').value = '默认';
    setFormEnv({});
  }
  renderProfiles();
}

function cancelEdit() { showCurrent(); }

function showImportView() {
  editingId = null;
  document.getElementById('currentView').style.display = 'none';
  document.getElementById('editView').style.display = 'none';
  document.getElementById('importView').style.display = '';
  document.getElementById('pageTitle').textContent = '粘贴导入';
  document.getElementById('pageBadge').className = 'badge badge-editing';
  document.getElementById('pageBadge').textContent = '导入';
  document.getElementById('importName').value = '';
  document.getElementById('importGroup').value = '默认';
  document.getElementById('importText').value = '';
  renderProfiles();
}

function newProfile() { showEditForm(null); }

async function editProfile(id) {
  const p = profiles.find(x => x.id === id);
  if (p) showEditForm(p);
}

function parseConfigText(text) {
  const trimmed = text.trim();
  if (!trimmed) throw new Error('请先粘贴配置内容');

  const candidates = [trimmed, `{${trimmed.replace(/,\s*$/, '')}}`];
  for (const candidate of candidates) {
    try {
      const parsed = JSON.parse(candidate);
      const source = parsed.env && typeof parsed.env === 'object' ? parsed.env : parsed;
      const env = {};
      ENV_KEYS.forEach(k => {
        if (typeof source[k] === 'string') env[k] = source[k];
      });
      if (Object.keys(env).length > 0) return { ...emptyEnv(), ...env };
    } catch (_) {}
  }

  const env = {};
  const re = /["']?(ANTHROPIC_[A-Z_]+)["']?\s*[:=]\s*["']([^"']*)["']/g;
  let match;
  while ((match = re.exec(trimmed)) !== null) {
    if (ENV_KEYS.includes(match[1])) env[match[1]] = match[2];
  }
  if (Object.keys(env).length === 0) throw new Error('没有识别到 ANTHROPIC_* 配置');
  return { ...emptyEnv(), ...env };
}

function emptyEnv() {
  return Object.fromEntries(ENV_KEYS.map(k => [k, '']));
}

async function importProfile(applyAfterSave) {
  let env;
  try {
    env = parseConfigText(document.getElementById('importText').value);
  } catch (e) {
    toast(e.message, 'error');
    return;
  }

  const name = document.getElementById('importName').value.trim() || env.ANTHROPIC_BASE_URL || env.ANTHROPIC_MODEL || '导入配置';
  const group = document.getElementById('importGroup').value.trim() || '默认';
  await api('/api/profiles', { method: 'POST', body: { name, group, env } });
  if (applyAfterSave) {
    await api('/api/apply', { method: 'POST', body: env });
    currentEnv = await api('/api/current');
    toast('已导入并应用: ' + name);
  } else {
    toast('已导入配置: ' + name);
  }
  profiles = await api('/api/profiles');
  renderCurrent();
  showCurrent();
}

async function saveProfile() {
  const name = document.getElementById('profileName').value.trim() || '未命名';
  const group = document.getElementById('profileGroup').value.trim() || '默认';
  const env = getFormEnv();
  if (editingId) {
    await api(`/api/profiles/${editingId}`, { method: 'PUT', body: { name, group, env } });
    toast('配置已更新');
  } else {
    await api('/api/profiles', { method: 'POST', body: { name, group, env } });
    toast('配置已保存');
  }
  profiles = await api('/api/profiles');
  showCurrent();
}

async function applyEditing() {
  const name = document.getElementById('profileName').value.trim() || '未命名';
  const group = document.getElementById('profileGroup').value.trim() || '默认';
  const env = getFormEnv();
  if (editingId) {
    await api(`/api/profiles/${editingId}`, { method: 'PUT', body: { name, group, env } });
  } else {
    await api('/api/profiles', { method: 'POST', body: { name, group, env } });
  }
  await api('/api/apply', { method: 'POST', body: env });
  profiles = await api('/api/profiles');
  currentEnv = await api('/api/current');
  renderCurrent();
  showCurrent();
  toast('已保存并应用: ' + name);
}

async function applyProfile(id) {
  const res = await api(`/api/apply/${id}`, { method: 'POST' });
  if (res.ok) {
    currentEnv = await api('/api/current');
    renderCurrent();
    renderProfiles();
    renderAllProfiles();
    toast('已切换到: ' + res.applied);
  }
}

async function deleteProfile(id) {
  const p = profiles.find(x => x.id === id);
  if (!confirm(`确认删除配置 "${p?.name}" ?`)) return;
  await api(`/api/profiles/${id}`, { method: 'DELETE' });
  profiles = await api('/api/profiles');
  if (editingId === id) showCurrent();
  else {
    renderProfiles();
    renderAllProfiles();
  }
  toast('已删除');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function init() {
  await reloadData();
}

init();
</script>
</body>
</html>
